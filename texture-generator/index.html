<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Texture Generator</title><meta name="description" content="Generate seamless procedural surface textures and export them as PNG."><link rel="stylesheet" href="style.css"></head><body>
<header><a href="../" aria-label="Back to dashboard">T / G</a><span>FORM STUDIES <b>—</b> TEXTURE</span><span class="status">● LIVE GENERATOR</span></header>
<main><section class="parameters"><div class="eyebrow">SURFACE / PROCEDURAL</div><h1>Texture<span>generator.</span></h1><p class="intro">Seamless surface patterns for moulds, casts and renders.</p>
<div class="control"><label for="kind">01 / PATTERN</label><select id="kind"><option value="fbm">Cloud noise</option><option value="ridged">Ridged rock</option><option value="cells">Cells</option><option value="stripes">Strata</option><option value="grain">Fine grain</option></select></div>
<div class="control"><label for="scale">02 / SCALE <output id="scaleValue"></output></label><input id="scale" type="range" min="1" max="24" step="1" value="6"><label for="detail">Detail <output id="detailValue"></output></label><input id="detail" type="range" min="1" max="8" step="1" value="4"><label for="contrast">Contrast <output id="contrastValue"></output></label><input id="contrast" type="range" min="0.2" max="3" step="0.05" value="1"><label for="seed">Seed</label><div class="row"><input id="seed" type="number" min="0" max="99999" value="1"><button id="random">RANDOM ↻</button></div></div>
<div class="control"><label>03 / COLOUR</label><div class="row"><input id="dark" type="color" value="#1c1d1b" aria-label="Dark colour"><input id="light" type="color" value="#d9dfd0" aria-label="Light colour"><label class="check"><input id="normal" type="checkbox"> Normal map</label></div><label for="size">Export size</label><select id="size"><option>512</option><option selected>1024</option><option>2048</option></select></div>
<div class="control"><button id="export" class="primary">EXPORT PNG ↓</button><button id="reset">RESET ↺</button></div></section>
<section class="preview"><div class="model-head"><span>LIVE PREVIEW</span><span>TILES SEAMLESSLY</span></div><canvas id="view" width="512" height="512" aria-label="Texture preview"></canvas><div class="model-foot"><label class="check"><input id="tile" type="checkbox"> Show 2×2 tiling</label></div></section></main>
<footer>PROCEDURAL TEXTURES ARE GENERATED IN THE BROWSER / NOTHING IS UPLOADED</footer><script type="module" src="app.js"></script></body></html>
